<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset = "UTF-8">
    <link rel="stylesheet" href="style.css">
    <title> Pour mon amour Glenn 🥰</title>  
  </head>
  <body>
    <main>
        <h1> Coucou mon Amour  </h1>
<p>Parce que je t'aime, tu me manque breaucoup. </p>
      <p>Je suis fière de ton évolution</p>
<button type="button" onclick="montrerMaPhoto()">Clique ici !</button>

        <div id="surprise" style="display:none; margin-top:20 px;">
            <p>Tadam ! ❤️</p>
            <img src="moi.jpg" alt="Photo de moi" style="max-width:300 px; border-radius:15 px; border: 5 px solid white; box-shadow: 0 4 px 8  px rgba (0,0,0,0.2);">
        </div>
    </main>

    <script>
        function montrerMaPhoto () {
            var x = document.getElementById("surprise");
            if (x.style.display === "none") {
                x.style.display = "block";
            } else {
                x.style.display = "none";
            }
        }
    </script>
</body>
</html>
